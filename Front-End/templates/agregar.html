{% extends "base.html" %}

{% block titulo %}Agregar producto - SakuraShop{% endblock %}

{% block contenido %}
    <h2>Agregar producto</h2>

    <form method="POST" action="{{ url_for('agregar') }}">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="precio">Precio</label>
        <input type="number" id="precio" name="precio" step="0.01" min="0" required>

        <label for="stock">Stock</label>
        <input type="number" id="stock" name="stock" min="0" required>

        <label for="tipo">Tipo</label>
        <input type="text" id="tipo" name="tipo" placeholder="Ej: Vinilo, Snack, Figura" required>

        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria" required>
            <option value="Musica">Musica</option>
            <option value="Japon">Japon</option>
        </select>

        <label for="imagen">Nombre de la imagen</label>
        <input type="text" id="imagen" name="imagen" placeholder="assets/nombre.jpg" required>

        <label for="descripcion">Descripcion</label>
        <textarea id="descripcion" name="descripcion" rows="4"></textarea>

        <button type="submit">Guardar producto</button>
    </form>
{% endblock %}
